<!DOCTYPE html><html><head><meta charset="utf-8"><title>Contact Sheet sketch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;800&family=Martian+Mono:wght@400;600&family=Reenie+Beanie&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;width:1440px;height:900px;overflow:hidden;background:#F1EEE7;color:#0D0D0D;font-family:"Schibsted Grotesk",sans-serif}
nav{display:flex;justify-content:space-between;padding:22px 48px;font:600 13px "Martian Mono"}nav b{font:800 22px "Schibsted Grotesk"}
h1{margin:20px 48px 0;font:800 92px/.92 "Schibsted Grotesk";letter-spacing:-.04em;max-width:900px}
.sheet{position:absolute;left:48px;right:48px;top:330px;bottom:48px;background:#0D0D0D;padding:22px;display:grid;grid-template-rows:repeat(3,1fr);gap:14px}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;border-top:10px dotted #2b2b2b;padding-top:6px}
.row i{background:#3A3A3A;border-radius:2px}.row i:nth-child(odd){background:#4a4a4a}
.circle{position:absolute;left:520px;top:440px;width:250px;height:150px;border:6px solid #E4362B;border-radius:50%;transform:rotate(-6deg)}
.note{position:absolute;right:90px;top:250px;font:54px "Reenie Beanie";color:#E4362B}
.cta{position:absolute;right:48px;top:110px;display:flex;gap:12px}.cta code{font:600 15px "Martian Mono";background:#0D0D0D;color:#F1EEE7;padding:16px 20px}.cta a{background:#F2C230;padding:16px 22px;font-weight:800}
</style></head><body>
<nav><b>Decklume</b><span>THEMES · HOW IT WORKS · DOCS · GITHUB</span></nav>

<div class="sheet"><div class="row"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="row"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="row"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
<div class="circle"></div>
</body></html>
